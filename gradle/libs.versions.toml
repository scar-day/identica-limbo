[versions]
velocity-api = "3.5.0-SNAPSHOT"
identica-api = "dev-e605d1b"
keystone = "dev-790a33e"
configura = "1.0.0"
lombok = "1.18.42"
adventure = "4.26.1"
jackson = "2.20.0"
annotations = "26.0.2"
bungeecord-api = "1.21-R0.4"

run-task = "3.1.0"
idea-ext = "1.4.1"

[libraries]
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }
bungeecord-api = { module = "net.md-5:bungeecord-api", version.ref = "bungeecord-api" }
identica-api = { module = "me.whereareiam.identica:api", version.ref = "identica-api" }
keystone = { module = "me.whereareiam:keystone", version.ref = "keystone" }
configura = { module = "me.whereareiam:configura", version.ref = "configura" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }

[plugins]
run-velocity = { id = "xyz.jpenilla.run-velocity", version.ref = "run-task" }
idea-ext = { id = "org.jetbrains.gradle.plugin.idea-ext", version.ref = "idea-ext" }

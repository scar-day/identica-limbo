name: Java CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Build as clean release version (without -dev#commitHash)?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: "! contains(toJSON(github.event.commits.*.message), '[SKIP-CI]')"

    runs-on: ubuntu-latest

    strategy:
      matrix:
        build-java-version: [ 21 ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.build-java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.build-java-version }}
          cache: 'gradle'

      - name: Configure Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
            IS_RELEASE="true"
          elif [[ "${{ inputs.release }}" == "true" ]]; then
            VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
            IS_RELEASE="true"
          else
            BASE_VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
            COMMIT_HASH="${GITHUB_SHA::7}"
            VERSION="${BASE_VERSION}-dev#${COMMIT_HASH}"
            IS_RELEASE="false"
          fi

          sed -i "s|^version=.*|version=${VERSION}|" gradle.properties
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION} (release: ${IS_RELEASE})"
          cat gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean check build

      - name: Upload artifact for Java ${{ matrix.build-java-version }}
        uses: actions/upload-artifact@v4
        with:
          name: IdenticaLimbo-java${{ matrix.build-java-version }}
          path: build/IdenticaLimbo-*.jar

      - name: Publish GitHub Release
        if: steps.version.outputs.is_release == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          name: "Identica Limbo ${{ steps.version.outputs.version }}"
          files: build/IdenticaLimbo-*.jar
          generate_release_notes: true
